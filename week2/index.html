<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Events</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="#">Club Events</a>
    <nav>
      <a href="#">Events</a>
      <a href="#">About</a>
      <a href="#">Join</a>
    </nav>
  </header>

  <main>
    <h1>Upcoming events</h1>
    <section class="cards">
      <article>
        <h2>Coding Night</h2>
        <p>Oct 20 · Lab 3</p>
      </article>
      <article>
        <h2>Web Dev Workshop</h2>
        <p>Oct 24 · Room 102</p>
      </article>
      <article>
        <h2>Gaming Night</h2>
        <p>Oct 28 · Student Lounge</p>
      </article>
      <article>
        <h2>Career Talk</h2>
        <p>Nov 02 · Hall B</p>
      </article>
      <article>
        <h2>AI & Cloud Meetup</h2>
        <p>Nov 06 · Online</p>
      </article>
      <article>
        <h2>Design Sprint</h2>
        <p>Nov 10 · Lab 1</p>
      </article>
    </section>

    <form>
      <label for="name">Name</label>
      <input id="name" required>
      <label for="email">Email</label>
      <input id="email" type="email" required>
      <button type="submit">Join</button>
    </form>
  </main>

  <footer>
    <p>MIS 457 Club</p>
  </footer>
</body>
</html>
